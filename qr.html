const QR = DATA.qr.map(r=>[...r].map(Number)), N = QR.length, QUIET = 3;
const DARKS = ["#1F2E7A","#28388C","#3A2F86","#543A96","#5E46A3","#1A8077","#16685F","#24529F"];
let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const shade = (hex, k) => { const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v*k))); return `rgb(${f(r)},${f(g)},${f(b)})`; };

// QR dark cells, each with a mosaic colour
const qCells=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(QR[y][x]) qCells.push({x,y,c:DARKS[Math.floor(rnd()*DARKS.length)]});
// Logo cells, with a light pixel-art jitter
const lCells = DATA.logo.map(([x,y,c])=>({x,y,c:shade(c,0.92+rnd()*0.16)}));
// Pair them in reading order so the motion stays coherent; every QR cell gets at least one tile
const byPos=(a,b)=>(a.y-b.y)||(a.x-b.x);
qCells.sort(byPos); lCells.sort(byPos);
const P = lCells.map((l,i)=>{ const q=qCells[Math.floor(i*qCells.length/lCells.length)];
  return {q,l,delay:0,lift:0.4+rnd()*0.6,spin:(rnd()-.5)}; });

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let S=400, dpr=1;
function resize(){ const r=cv.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,3); S=r.width;
  cv.width=Math.round(S*dpr); cv.height=Math.round(S*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
new ResizeObserver(resize).observe(cv);

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state=0, from=0, t0=0, anim=false; // 0 = logo, 1 = qr
const DUR=1100, SPREAD=700;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

function geom(){
  const m=S/(N+QUIET*2), c=S*0.86/DATA.lw, off=(S-c*DATA.lw)/2;
  return {m,c,off};
}
function draw(now){
  const {m,c,off}=geom();
  ctx.clearRect(0,0,S,S);
  ctx.fillStyle="#FFFFFF"; ctx.beginPath(); ctx.roundRect(0,0,S,S,18); ctx.fill();
  const t = anim ? now - t0 : 1e9;
  const list=[];
  for(const p of P){
    // e: 0 = logo position, 1 = QR position
    let k = Math.min(1,Math.max(0,(t-p.delay)/DUR)); k=ease(k);
    const e = from===0 ? k : 1-k;
    const qx=(p.q.x+QUIET)*m, qy=(p.q.y+QUIET)*m, lx=off+p.l.x*c, ly=off+p.l.y*c;
    const size = c+(m-c)*e, mid=Math.sin(Math.PI*e);
    const x=lx+(qx-lx)*e, y=ly+(qy-ly)*e - mid*S*0.10*p.lift;
    list.push({x,y,size,col:e>0.5?p.q.c:p.l.c,mid,e});
  }
  list.sort((a,b)=>a.mid-b.mid);
  for(const d of list){
    const depth = d.size*(0.22*d.mid + 0.14*(1-d.e)); // flat when it is a QR, blocky as a logo or in flight
    if(d.mid>0.05){ ctx.fillStyle=`rgba(22,32,79,${0.10*d.mid})`; ctx.fillRect(d.x+d.size*0.1,d.y+d.size*0.9+d.mid*S*0.05,d.size*0.9,d.size*0.25); }
    ctx.fillStyle=d.col; ctx.fillRect(d.x,d.y,d.size+0.4,d.size+0.4);
    if(depth>0.3){ ctx.fillStyle="rgba(0,0,0,.22)"; ctx.fillRect(d.x,d.y+d.size-depth,d.size+0.4,depth+0.4);
      ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(d.x,d.y,d.size+0.4,Math.max(0.6,depth*0.45)); }
  }
}
function loop(now){ draw(now); const done = now - t0 > DUR + SPREAD + 50; if(!done) requestAnimationFrame(loop); else { anim=false; draw(); } }

function setUi(){
  const qr=state===1;
  document.getElementById("toggle").textContent = qr ? "وريني الشعار" : "وريني الـQR";
  document.getElementById("hint").textContent = qr ? "اضغط على الكود يرجع الشعار" : "اضغط على الشعار يطلع لك الـQR";
  document.getElementById("wordImg").style.opacity = qr ? 0 : 1;
  document.getElementById("scanTxt").style.opacity = qr ? 1 : 0;
}
function toggle(){
  from=state; state=1-state; setUi();
  // tiles leave in a wave from the centre outward
  for(const p of P){ const src = from===0 ? {x:p.l.x/DATA.lw,y:p.l.y/DATA.lh} : {x:p.q.x/N,y:p.q.y/N};
    p.delay = Math.hypot(src.x-.5,src.y-.5)*SPREAD*1.1 + rnd()*120; }
  if(reduce){ anim=false; from=state; draw(); return; }
  anim=true; t0=performance.now(); requestAnimationFrame(loop);
}
// when resting, draw the resting state directly
const _draw=draw; draw=function(now){ if(!anim){ from = state===1 ? 0 : 1; } _draw(anim?now:undefined); };

cv.addEventListener("click",toggle);
cv.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
document.getElementById("toggle").addEventListener("click",toggle);
document.getElementById("wordImg").src = DATA.text;
const start=(location.hash||"").replace("#","");
if(start==="qr"){ state=1; }
setUi(); resize();
</script>
